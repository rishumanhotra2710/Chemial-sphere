<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ChemicalSphere&trade; &mdash; Decision Intelligence Platform</title>
<style>
:root{
  --navy:#0B1E3D; --navy2:#122B52; --navy3:#1A3A6B; --oracle:#C74634; --maroon:#770107;
  --amber:#E8A25C; --ink:#1A1A1A; --grey:#5B5B5B; --line:#E4E8EF;
  --bg:#F5F7FA; --card:#FFFFFF;
  --d1:#770107; --d2:#D9531E; --d3:#3C6B2A; --d4:#154C8C; --d5:#5B2A86; --d6:#1E7A73;
  --crit:#B3261E; --high:#D9531E; --med:#8A6D1F; --good:#1E7A4A;
  --sidebar-w:250px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}

/* ---------- layout shell ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--navy);color:#fff;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;padding-bottom:20px}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:#1D3760;border-radius:3px}
.brand-block{padding:20px 20px 16px;border-bottom:1px solid #1D3760}
.brand{font-size:18px;font-weight:700;letter-spacing:.2px}
.brand span{color:var(--amber)}
.brand-sub{font-size:10.5px;color:#8FA3C4;margin-top:4px;line-height:1.4}
.navgroup{padding:14px 0 4px}
.navgroup-label{font-size:9.5px;letter-spacing:1.1px;text-transform:uppercase;color:#6C86AE;padding:6px 20px;font-weight:700}
.navitem{display:block;padding:8px 20px;font-size:12.8px;color:#C7D6EA;border-left:3px solid transparent;cursor:pointer;transition:.12s}
.navitem:hover{background:rgba(255,255,255,.05);color:#fff}
.navitem.active{background:rgba(232,162,92,.13);border-left-color:var(--amber);color:#fff;font-weight:600}
.main{flex:1;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:18px 30px 14px;position:sticky;top:0;z-index:20}
.topbar h1{font-size:21px;color:var(--navy);font-weight:700;letter-spacing:-.2px}
.topbar .sub{font-size:12.5px;color:var(--grey);margin-top:2px}
.topbar-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.filters{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.chip{background:#fff;border:1px solid var(--line);color:var(--grey);padding:6px 13px;border-radius:14px;font-size:11.8px;cursor:pointer;transition:.12s;font-family:inherit}
.chip:hover{border-color:var(--amber)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.selfilter{border:1px solid var(--line);border-radius:14px;padding:6px 11px;font-size:11.8px;color:var(--grey);background:#fff;font-family:inherit}
.scopeline{font-size:11.5px;color:#8A93A3;margin-top:9px}
.scopeline b{color:var(--grey);font-weight:600}
.page-body{padding:20px 30px 60px}
.page{display:none}
.page.active{display:block}

/* ---------- sections/cards ---------- */
.sec{margin-bottom:26px}
.sechead{display:flex;align-items:baseline;gap:12px;margin-bottom:11px;justify-content:space-between}
.sechead h2{font-size:13px;letter-spacing:1.1px;text-transform:uppercase;color:var(--maroon);font-weight:700}
.sechead p{font-size:12px;color:var(--grey)}
.card{background:var(--card);border-radius:8px;box-shadow:0 1px 3px rgba(11,30,61,.09);padding:16px 18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
h3.ct{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:10px;letter-spacing:.2px}
h3.ct .note{font-size:11px;color:var(--grey);font-weight:400;display:block;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--grey);border-bottom:1px solid var(--line);padding:0 8px 6px;font-weight:600}
td{padding:7px 8px;border-bottom:1px solid #F0F2F6}
tr:last-child td{border-bottom:none}
tr.alert td{background:#FDF3F1}
tr.hlrow td{background:#FBF0DC!important;transition:background 1.4s}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;min-width:56px}
.bar i{display:block;height:100%;border-radius:3px}
.pill{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:9px;color:#fff;letter-spacing:.3px}
@media(max-width:1000px){.two{grid-template-columns:1fr}}

/* ---------- KPI tile v2 ---------- */
.tiles2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi2{background:var(--card);border-radius:8px;padding:14px 16px;box-shadow:0 1px 3px rgba(11,30,61,.09)}
.kpi2-label{font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--grey);font-weight:700;margin-bottom:8px}
.kpi2-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kpi2-value{font-size:24px;font-weight:700;color:var(--navy);letter-spacing:-.5px}
.pill2{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
.pill2.up{background:#E4F3EA;color:var(--good)}
.pill2.dn{background:#FBE9E7;color:var(--crit)}
.pill2.fl{background:#EEF1F6;color:var(--grey)}
.kpi2-spark{margin-top:8px}

/* ---------- insight card v2 ---------- */
.icards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:12px}
.icard2{background:var(--card);border-radius:8px;box-shadow:0 1px 3px rgba(11,30,61,.09);border-left:4px solid var(--high);padding:14px 16px}
.icard2-head{display:flex;align-items:center;gap:7px;margin-bottom:9px;flex-wrap:wrap}
.cat-pill{font-size:9.5px;font-weight:700;letter-spacing:.6px;padding:3px 9px;border-radius:4px}
.sev-pill{font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:3px 9px;border-radius:4px}
.sev-pill.Critical{background:#FBE0DD;color:var(--crit)}
.sev-pill.High{background:#FBE9E1;color:var(--high)}
.sev-pill.Medium{background:#F3E9CE;color:var(--med)}
.icard2-value{margin-left:auto;font-size:14px;font-weight:700;color:var(--navy)}
.icard2-title{font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:6px;line-height:1.35}
.icard2-body{font-size:12.5px;color:var(--grey);margin-bottom:9px;line-height:1.5}
.icard2-route{font-size:12px;color:var(--ink);margin-bottom:10px;padding:7px 10px;background:#F7F5EF;border-left:2px solid var(--amber);border-radius:0 4px 4px 0}
.icard2-route b{color:var(--maroon)}
.icard2-actions{display:flex;gap:8px}
.btn-outline{background:#fff;border:1px solid var(--line);color:var(--navy);padding:6px 12px;border-radius:5px;font-size:11.5px;font-weight:600}
.btn-outline:hover{border-color:var(--navy)}
.btn-dark{background:var(--navy);border:1px solid var(--navy);color:#fff;padding:6px 12px;border-radius:5px;font-size:11.5px;font-weight:600}
.btn-dark:hover{background:var(--navy2)}
.icard2-workings{margin-top:10px;padding:10px 12px;background:#F2F5F9;border-radius:5px;font-size:11.8px;color:var(--grey);display:none}
.icard2-workings.show{display:block}
.icard2-workings code{font-family:Consolas,monospace;color:var(--navy);background:#fff;padding:1px 4px;border-radius:3px}

/* ---------- decomposition widget ---------- */
.decomp-stats{display:flex;gap:26px;margin:10px 0 14px;flex-wrap:wrap}
.decomp-stat .dv{font-size:20px;font-weight:700;color:var(--good)}
.decomp-stat .dl{font-size:10.5px;color:var(--grey);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.decomp-bars{display:flex;flex-direction:column;gap:10px}
.decomp-barrow{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:10px}
.decomp-barrow .bl{font-size:12px;color:var(--grey);text-align:right}
.decomp-track{position:relative;height:22px;background:#F0F2F6;border-radius:4px;overflow:hidden}
.decomp-fill{position:absolute;top:0;left:0;height:100%;border-radius:4px;display:flex;align-items:center;padding-left:8px;font-size:11px;font-weight:700;color:#fff}
.decomp-axis{display:flex;justify-content:space-between;font-size:10px;color:#8A93A3;margin-top:4px}
.decomp-foot{font-size:12px;color:var(--grey);margin-top:12px;padding-top:10px;border-top:1px dotted var(--line)}

/* ---------- combo chart with tooltip ---------- */
.combo-wrap{position:relative}
.combo-tooltip{position:absolute;background:var(--navy);color:#fff;font-size:11px;padding:7px 10px;border-radius:5px;pointer-events:none;opacity:0;transition:opacity .1s;white-space:nowrap;z-index:5;line-height:1.5}
.combo-tooltip b{color:var(--amber)}

/* ---------- what-if slider ---------- */
.whatif-grid{display:grid;grid-template-columns:280px 1fr;gap:20px}
.whatif-controls label{display:block;font-size:11px;color:var(--grey);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin:14px 0 6px}
.whatif-controls select{width:100%;padding:8px;border:1px solid var(--line);border-radius:5px;font-size:12.5px;font-family:inherit}
.whatif-controls input[type=range]{width:100%}
.whatif-controls .rangeval{font-size:12px;color:var(--navy);font-weight:700;float:right}
.whatif-result{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.whatif-result .box{background:#F7FAFC;border-radius:6px;padding:12px 14px;text-align:center}
.whatif-result .box .v{font-size:20px;font-weight:700;color:var(--navy)}
.whatif-result .box .l{font-size:10px;color:var(--grey);text-transform:uppercase;letter-spacing:.4px;margin-top:3px}
@media(max-width:900px){.whatif-grid{grid-template-columns:1fr}}

/* ---------- pareto / concentration bar ---------- */
.pareto-row{display:grid;grid-template-columns:140px 1fr 60px;align-items:center;gap:10px;margin-bottom:6px}
.pareto-row .pn{font-size:11.5px;color:var(--ink)}
.pareto-row .pv{font-size:11.5px;color:var(--grey);text-align:right}

/* ---------- outcome ---------- */
.ogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.out{background:var(--card);border-radius:7px;padding:13px 15px;box-shadow:0 1px 3px rgba(11,30,61,.09)}
.out .ol{font-size:12.5px;font-weight:600;color:var(--navy)}
.out .ot{font-size:10px;color:var(--amber);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px}
.ov{display:flex;align-items:baseline;gap:9px;margin-bottom:6px}
.ov .b{font-size:12px;color:var(--grey);text-decoration:line-through}
.ov .a{font-size:21px;font-weight:600;color:var(--navy)}
.ov .d{font-size:12px;font-weight:700;margin-left:auto}
.up{color:var(--good)} .dn{color:var(--crit)} .fl{color:var(--grey)}

/* ---------- overview quicklinks ---------- */
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.qcard{background:var(--card);border-radius:8px;padding:15px 16px;box-shadow:0 1px 3px rgba(11,30,61,.09);cursor:pointer;border-top:3px solid var(--navy3);transition:.12s}
.qcard:hover{box-shadow:0 4px 12px rgba(11,30,61,.14)}
.qcard .qt{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:5px}
.qcard .qd{font-size:11.8px;color:var(--grey);line-height:1.4}
.qcard .qa{font-size:11px;color:var(--oracle);font-weight:700;margin-top:9px}

/* ---------- knowledge graph ---------- */
.kg{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.node{background:var(--navy);color:#fff;font-size:11px;font-weight:600;padding:6px 12px;border-radius:4px}
.node.hl{background:var(--oracle)}
.arw{color:var(--grey)}
.gcol{background:#F8FAFC;border:1px solid var(--line);border-radius:5px;padding:10px 12px}
.gcol h4{font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:var(--maroon);margin-bottom:6px}
.gcol div{font-size:12px;color:var(--ink);padding:2px 0}
.gcol small{color:var(--grey)}

footer{text-align:center;color:var(--grey);font-size:11px;padding:22px;border-top:1px solid var(--line);margin-top:10px}
.badge-hazard{font-size:9px;padding:1px 6px;border-radius:8px;background:#EEF1F6;color:var(--grey)}
.hide{display:none!important}
</style>
</head>
<body>

<div class="shell">
  <nav class="sidebar" id="sidebar">
    <div class="brand-block">
      <div class="brand">Chemical<span>Sphere</span>&trade;</div>
      <div class="brand-sub">Decision intelligence on the Oracle AI Data Platform</div>
    </div>
    <div id="navlist"></div>
  </nav>

  <div class="main">
    <div id="topbars"></div>
    <div class="page-body">
      <div id="pages"></div>
    </div>
    <footer id="foot"></footer>
  </div>
</div>

<script src="data.js"></script>
<script>
const D = window.CS_DATA;
const C = {Manufacturing:'#770107','Supply Chain':'#D9531E',Formula:'#3C6B2A',Quality:'#154C8C',Logistics:'#5B2A86',Financial:'#1E7A73'};
const GEO_COL = {Low:'#1E7A4A',Medium:'#8A6D1F',High:'#B3261E'};

/* ---------- formatters ---------- */
const pct=v=>(v*100).toFixed(1)+'%';
const pct0=v=>(v*100).toFixed(0)+'%';
const num=(v,d=0)=>v.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const usd=v=>(v<0?'-':'')+'$'+(Math.abs(v)>=1e6?(Math.abs(v)/1e6).toFixed(1)+'M':Math.abs(v)>=1e3?(Math.abs(v)/1e3).toFixed(0)+'K':Math.abs(v).toFixed(0));
const usd2=v=>'$'+v.toFixed(2);

/* ---------- page registry ---------- */
const PAGES = [
  {id:'overview', label:'Overview', group:null,
   title:'Overview', sub:'What has ChemicalSphere™ changed since it went live?'},
  {id:'exec', label:'Executive Command Center', group:'BUSINESS INTELLIGENCE',
   title:'Executive Command Center', sub:'How is the estate performing?', chips:['3','6','12'], defaultChip:'6'},
  {id:'plant', label:'Plant Performance', group:'BUSINESS INTELLIGENCE',
   title:'Plant Performance', sub:'Where is production capacity being lost?', region:true},
  {id:'formula', label:'Formula & Product Mix', group:'BUSINESS INTELLIGENCE',
   title:'Formula & Product Mix', sub:'Which recipes and families are carrying (or costing) the portfolio?'},
  {id:'supplychain', label:'Supply Chain', group:'BUSINESS INTELLIGENCE',
   title:'Supply Chain', sub:'Which suppliers are putting continuity of supply at risk?', region:true},
  {id:'inventory', label:'Inventory & Waste', group:'BUSINESS INTELLIGENCE',
   title:'Inventory & Waste', sub:'Where is working capital ageing past the safe-resale window?'},
  {id:'customer', label:'Loyalty & Guest', group:'BUSINESS INTELLIGENCE',
   title:'Customer & Revenue', sub:'Who is the estate’s revenue actually coming from?', region:true},
  {id:'demand', label:'Demand Forecasting', group:'PREDICTIVE',
   title:'Demand Forecasting', sub:'Where is throughput and revenue headed next quarter?'},
  {id:'labour', label:'Labour Optimiser', group:'PREDICTIVE',
   title:'Production Scheduling Optimiser', sub:'How much OEE is recoverable by rebalancing volume across plants?'},
  {id:'waste', label:'Waste & Shelf-Life Risk', group:'PREDICTIVE',
   title:'Waste & Shelf-Life Risk', sub:'Is shelf-life exposure trending up or down, and where does it land next?'},
  {id:'marginwhatif', label:'Margin What-If', group:'PREDICTIVE',
   title:'Margin What-If', sub:'If raw-material cost or yield moves, what happens to formula margin?'},
  {id:'supplydep', label:'Supply Dependency', group:'PREDICTIVE',
   title:'Supply Dependency', sub:'Which raw materials would hurt most if their top supplier failed tomorrow?'},
  {id:'menuimpact', label:'Menu Change Impact', group:'PREDICTIVE',
   title:'Formula Change Impact', sub:'Which ingredient in a recipe has the most leverage over its cost?'},
  {id:'docintel', label:'Document Intelligence', group:'PREDICTIVE',
   title:'Document Intelligence', sub:'Is the batch genealogy behind every recall claim actually traceable?'},
  {id:'loyalty', label:'Loyalty Economics', group:'PREDICTIVE',
   title:'Customer Economics', sub:'How concentrated is revenue in the top accounts?'},
  {id:'access', label:'Access & Governance', group:'PREDICTIVE',
   title:'Access & Governance', sub:'Who sees what, by role?'},
  {id:'trust', label:'Data Trust', group:'PREDICTIVE',
   title:'Data Trust', sub:'Where does each fact table originate, and how much of it is there?'},
  {id:'grain', label:'Decision Grain', group:'PREDICTIVE',
   title:'Decision Grain', sub:'The full audit log of every recommendation the rule layer fired.'},
  {id:'reconciliation', label:'Margin Reconciliation', group:'PREDICTIVE',
   title:'Margin Reconciliation', sub:'Walking the bridge from baseline margin to where the estate sits today.'},
  {id:'modelintel', label:'Model Intelligence', group:'PREDICTIVE',
   title:'Model Intelligence', sub:'What is each agent watching, and at what threshold does it fire?'},
];
let ACTIVE_PAGE='exec';

function buildNav(){
  let html='';
  let lastGroup=undefined;
  for(const p of PAGES){
    if(p.group!==lastGroup){
      if(p.group) html+=`<div class="navgroup"><div class="navgroup-label">${p.group}</div>`;
      else html+='<div class="navgroup" style="padding-top:8px">';
      lastGroup=p.group;
    }
    html+=`<a class="navitem" data-nav="${p.id}">${p.label}</a>`;
  }
  document.getElementById('navlist').innerHTML=html;
  document.querySelectorAll('.navitem').forEach(el=>el.onclick=()=>navigate(el.dataset.nav));
}

function buildTopbars(){
  document.getElementById('topbars').innerHTML = PAGES.map(p=>`
    <div class="topbar" id="topbar-${p.id}" style="display:none">
      <div class="topbar-row">
        <div><h1>${p.title}</h1><div class="sub">${p.sub}</div></div>
        <div class="filters" id="filters-${p.id}">
          ${p.chips?p.chips.map(c=>`<button class="chip ${c===p.defaultChip?'on':''}" data-months="${c}" onclick="setMonths('${p.id}',${c},this)">Last ${c} Months</button>`).join(''):''}
          ${p.region?`<select class="selfilter" id="regionsel-${p.id}" onchange="setRegion('${p.id}',this.value)">
            <option value="ALL">All Regions</option><option>EMEA</option><option>AMER</option><option>APAC</option><option>LATAM</option>
          </select>`:''}
        </div>
      </div>
      <div class="scopeline" id="scope-${p.id}"></div>
    </div>`).join('');
}

function buildPageShells(){
  document.getElementById('pages').innerHTML = PAGES.map(p=>`<section class="page" id="page-${p.id}"></section>`).join('');
}

function navigate(id){
  ACTIVE_PAGE=id;
  document.querySelectorAll('.navitem').forEach(el=>el.classList.toggle('active', el.dataset.nav===id));
  document.querySelectorAll('.topbar').forEach(el=>el.style.display='none');
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('active'));
  document.getElementById('topbar-'+id).style.display='block';
  document.getElementById('page-'+id).classList.add('active');
  window.scrollTo(0,0);
}

/* ---------- shared: sparkline ---------- */
function spark(series,color){
  const W=100,H=30;
  const vs=series; const mn=Math.min(...vs), mx=Math.max(...vs); const pad=(mx-mn)*0.18||Math.abs(mn)*0.05||1;
  const lo=mn-pad, hi=mx+pad;
  const x=i=>i*(W/(vs.length-1||1));
  const y=v=>H-((v-lo)/(hi-lo||1))*H;
  const pts=vs.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const lx=x(vs.length-1), ly=y(vs[vs.length-1]);
  return `<svg viewBox="0 0 ${W} ${H}" width="90" height="26" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${lx}" cy="${ly}" r="2.4" fill="${color}"/></svg>`;
}

/* ---------- shared: KPI tile v2 ---------- */
function kpiTile2(label,valueStr,deltaPct,invert,sparkSeries){
  const good = invert? deltaPct<0 : deltaPct>0;
  const cls = Math.abs(deltaPct)<0.004 ? 'fl' : (good?'up':'dn');
  const arrow = Math.abs(deltaPct)<0.004 ? '–' : (deltaPct>0?'▲':'▼');
  const color = cls==='up' ? '#1E7A4A' : cls==='dn' ? '#B3261E' : '#8A93A3';
  return `<div class="kpi2">
    <div class="kpi2-label">${label}</div>
    <div class="kpi2-row"><div class="kpi2-value">${valueStr}</div>
      <span class="pill2 ${cls}">${arrow} ${(Math.abs(deltaPct)*100).toFixed(1)}%</span></div>
    <div class="kpi2-spark">${spark(sparkSeries,color)}</div>
  </div>`;
}

function trendSlice(months, key){
  return D.trend.slice(-months).map(t=>t[key]);
}

/* ---------- shared: insight card v2 (agents) ---------- */
let workingsOpen={};
function extractCode(entity){ const m=entity.match(/\(([A-Z]{2,5}-\d+)\)/); return m?m[1]:null; }
const DOMAIN_PAGE = {Manufacturing:'plant', 'Supply Chain':'supplychain', Formula:'formula'};
function extractDollar(str){ const m=str.match(/\$[\d,\.]+[MK]?/); return m?m[0]:''; }

function insightCard2(a, idx){
  const code = extractCode(a.entity);
  const page = DOMAIN_PAGE[a.domain];
  const canOpen = code && page;
  const rule = D.agent_rules.find(r=>r.agent===a.agent);
  const thVal = rule ? D.thresholds[rule.threshold_key] : null;
  return `<div class="icard2" style="border-left-color:${C[a.domain]}">
    <div class="icard2-head">
      <span class="cat-pill" style="background:${C[a.domain]}1a;color:${C[a.domain]}">${a.domain.toUpperCase()}</span>
      <span class="sev-pill ${a.severity}">${a.severity}</span>
      <span class="icard2-value">${extractDollar(a.impact)}</span>
    </div>
    <div class="icard2-title">${a.entity} — ${a.signal}</div>
    <div class="icard2-body">${a.finding}</div>
    <div class="icard2-route"><b>${a.domain} →</b> ${a.action}</div>
    <div class="icard2-actions">
      <button class="btn-outline" onclick="toggleWorkings(${idx})">Show workings</button>
      ${canOpen?`<button class="btn-dark" onclick="openEntity('${page}','${code}')">Open ${a.domain==='Formula'?'formula':a.domain==='Manufacturing'?'plant':'supplier'}</button>`:''}
    </div>
    <div class="icard2-workings" id="workings-${idx}">
      Detection is arithmetic: <code>${a.agent}</code> watches <b>${rule?rule.watches:a.domain}</b>.
      Rule fires when the value breaches <code>${rule?rule.threshold_key:'—'} = ${thVal!=null?(thVal<1?pct0(thVal):thVal):'—'}</code>.
      Estimated impact: <b>${a.impact}</b>.
    </div>
  </div>`;
}
function toggleWorkings(idx){
  const el=document.getElementById('workings-'+idx);
  el.classList.toggle('show');
}
function openEntity(page, code){
  navigate(page);
  setTimeout(()=>{
    document.querySelectorAll('.navitem').forEach(el=>el.classList.toggle('active', el.dataset.nav===page));
    const row=document.querySelector(`tr[data-code="${code}"]`);
    if(row){ row.scrollIntoView({behavior:'smooth',block:'center'}); row.classList.add('hlrow');
      setTimeout(()=>row.classList.remove('hlrow'),1800); }
  },60);
}
function agentGrid(list){
  return `<div class="icards2">${list.map((a,i)=>insightCard2(a,i)).join('')}</div>`;
}

/* ---------- shared: decomposition widget ---------- */
function decompWidget(el, title, sub, stats, bars, footer){
  const maxAbs = Math.max(...bars.map(b=>Math.abs(b.dollars)), 1);
  el.innerHTML = `<h3 class="ct">${title}<span class="note">${sub}</span></h3>
    <div class="decomp-stats">${stats.map(s=>`<div class="decomp-stat"><div class="dv">${s.v}</div><div class="dl">${s.l}</div></div>`).join('')}</div>
    <div class="decomp-bars">${bars.map(b=>`
      <div class="decomp-barrow"><div class="bl">${b.label}</div>
        <div class="decomp-track"><div class="decomp-fill" style="width:${Math.max(2,Math.abs(b.dollars)/maxAbs*100)}%;background:${b.dollars>=0?'#3C6B2A':'#B3261E'}">${usd(b.dollars)}</div></div>
      </div>`).join('')}
    </div>
    <div class="decomp-foot">${footer}</div>`;
}

/* ---------- shared: combo chart (bars + moving avg line + tooltip) ---------- */
function comboChart(el, periods, bars, ma, opts){
  opts = opts||{};
  const W=440,H=170,P={l:44,r:10,t:14,b:22};
  const allVals = bars.concat(ma);
  const dataMin=Math.min(...allVals), dataMax=Math.max(...allVals);
  const pad=(dataMax-dataMin)*0.12||Math.abs(dataMax)*0.05||1;
  let lo=dataMin-pad, hi=dataMax+pad;
  if(dataMin>=0) lo=Math.max(0,lo);
  const n=periods.length;
  const x=i=>P.l+i*(W-P.l-P.r)/(n-1||1);
  const y=v=>P.t+(1-(v-lo)/(hi-lo))*(H-P.t-P.b);
  const bw=Math.max(2,(W-P.l-P.r)/n*0.62);
  const barsSvg = bars.map((v,i)=>`<rect x="${x(i)-bw/2}" y="${y(v)}" width="${bw}" height="${y(0)-y(v)>=0?y(0)-y(v):0.001}" fill="#C9D2DF"/>`).join('');
  const maPts = ma.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const grid=[0,.5,1].map(f=>{const v=lo+f*(hi-lo);
    return `<line x1="${P.l}" y1="${y(v)}" x2="${W-P.r}" y2="${y(v)}" stroke="#EEF1F6"/>
      <text x="${P.l-5}" y="${y(v)+3}" font-size="8.5" fill="#8A93A3" text-anchor="end">${opts.fmt?opts.fmt(v):v.toFixed(0)}</text>`}).join('');
  const labs = periods.map((p,i)=>(i%Math.ceil(n/7)===0||i===n-1)?`<text x="${x(i)}" y="${H-6}" font-size="8" fill="#8A93A3" text-anchor="middle">${p.slice(2)}</text>`:'').join('');
  const id='combo-'+Math.random().toString(36).slice(2,8);
  el.innerHTML=`<div class="combo-wrap">
    <svg viewBox="0 0 ${W} ${H}" width="100%" id="${id}">
      ${grid}${barsSvg}
      <polyline points="${maPts}" fill="none" stroke="${opts.lineColor||'#0B1E3D'}" stroke-width="2.2" stroke-linejoin="round"/>
      <line id="${id}-guide" x1="0" y1="${P.t}" x2="0" y2="${H-P.b}" stroke="#B9C6DA" stroke-width="1" style="display:none"/>
      ${labs}
      <rect x="${P.l}" y="0" width="${W-P.l-P.r}" height="${H}" fill="transparent" id="${id}-hit"/>
    </svg>
    <div class="combo-tooltip" id="${id}-tip"></div>
  </div>`;
  const svg=document.getElementById(id), hit=document.getElementById(id+'-hit'),
        guide=document.getElementById(id+'-guide'), tip=document.getElementById(id+'-tip');
  hit.addEventListener('mousemove', e=>{
    const rect=svg.getBoundingClientRect();
    const mx=(e.clientX-rect.left)*(W/rect.width);
    let i=Math.round((mx-P.l)/((W-P.l-P.r)/(n-1||1)));
    i=Math.max(0,Math.min(n-1,i));
    guide.style.display='block'; guide.setAttribute('x1',x(i)); guide.setAttribute('x2',x(i));
    tip.style.opacity=1;
    tip.style.left=Math.min(rect.width-140, Math.max(0,(x(i)/W)*rect.width+8))+'px';
    tip.style.top=(y(bars[i])/H)*rect.height-46+'px';
    tip.innerHTML=`${periods[i]}<br>${opts.barLabel||'Value'}: <b>${opts.fmt?opts.fmt(bars[i]):bars[i]}</b><br>${opts.maLabel||'Moving avg'}: <b>${opts.fmt?opts.fmt(ma[i]):ma[i]}</b>`;
  });
  hit.addEventListener('mouseleave', ()=>{guide.style.display='none'; tip.style.opacity=0;});
}
function movingAvg(arr,w){
  return arr.map((_,i)=>{const s=Math.max(0,i-w+1); const seg=arr.slice(s,i+1); return seg.reduce((a,b)=>a+b,0)/seg.length;});
}
